server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # Todo lo que no sea un archivo existente va al front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Los .php se envían a PHP-FPM (servicio "php", puerto 9000)
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquea archivos ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }
}
