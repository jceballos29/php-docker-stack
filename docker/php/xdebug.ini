; Xdebug 3. El modo se controla con la variable de entorno XDEBUG_MODE
; (off | debug | develop | debug,develop ...). Si no está definida, queda desactivado.
xdebug.mode = ${XDEBUG_MODE:-off}
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
; "trigger": solo depura cuando se pide (cookie/extensión del navegador o variable en CLI).
; Cambia a "yes" si quieres depurar TODAS las peticiones mientras practicas.
xdebug.start_with_request = trigger
xdebug.idekey = VSCODE
